name: 在庫チェック

on:
  schedule:
    # GitHub 側で大幅に間引かれ、実測では 1 時間前後の間隔になる。
    # そのため 1 回の実行を長く回して、次の実行までの隙間を自前で埋める。
    # GitHub ホストランナーは 1 ジョブ最大 6 時間のため、5.5 時間（330 分）を既定にしている。
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行内容'
        type: choice
        default: 'loop'
        options:
          - loop           # 既定。一定時間ループしながら監視する
          - once           # 1 回だけチェックする
          - test-notify    # 通知が届くかだけ確認する
          - force-notify   # 在庫ありなら再通知間隔を無視して通知する
      loop_minutes:
        description: 'ループする分数（loop のとき）'
        type: string
        default: '330'

permissions:
  contents: write

concurrency:
  # 実行が重なって状態が壊れるのを防ぐ。走っている間に来た分は待たせる。
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # ループ既定 330 分 + 後始末の余裕
    env:
      # ランナーの既定は UTC。手元の Mac は JST で時刻を記録するため、
      # 揃えておかないと履歴を統合したときに 9 時間ずれる。
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: 在庫を監視する
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # 外部の死活監視。未設定なら watcher 側が黙って ping を飛ばさない
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # 次の実行を自分で起こすためのトークン。未設定なら連鎖しない。
          # 既定の GITHUB_TOKEN では新しい実行を起こせない仕様のため別途必要。
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode || 'loop' }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '330' }}
          INTERVAL_SECONDS: '120'
        run: |
          set -uo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 在庫状態が変わったらその場で記録する。実行が打ち切られても履歴が残るように、
          # ループの最後にまとめてではなく変化のたびにコミットする。
          persist() {
            git add state.json
            if git diff --staged --quiet; then
              return 0
            fi
            git commit -q -m "在庫状態を更新: $(date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase -q origin main || return 0
            git push -q origin HEAD:main || echo "push に失敗（次の変化時に再試行）"
          }

          case "$MODE" in
            test-notify)
              python3 watcher.py --test-notify
              exit $?
              ;;
            force-notify)
              python3 watcher.py --once --durable-state --force-notify
              persist
              exit 0
              ;;
            once)
              python3 watcher.py --once --durable-state
              persist
              exit 0
              ;;
          esac

          # 設定不備（通知先が未設定など）はここで落として気づけるようにする
          python3 watcher.py --once --durable-state || exit $?
          persist

          START_TS=$(date +%s)
          END=$(( START_TS + LOOP_MINUTES * 60 ))
          n=1
          while true; do
            REMAIN=$(( END - $(date +%s) ))
            if [ "$REMAIN" -lt "$INTERVAL_SECONDS" ]; then
              break
            fi
            sleep "$INTERVAL_SECONDS"
            n=$(( n + 1 ))
            # 一時的な取得失敗でループ全体を止めない
            python3 watcher.py --once --durable-state || echo "この回は失敗（継続します）"
            persist
          done
          echo "ループ終了: ${n} 回チェックしました（約 ${LOOP_MINUTES} 分）"

          # 次の実行を自分で起こす。
          # schedule: は実測で 34 時間発火しないことがあり、5.5 時間ループの
          # 終わりを引き継げない事例が 3 回続いた。workflow_dispatch は
          # 間引かれないので、こちらで繋ぐ。
          #
          # 短時間で終わったときは起こさない。起動直後に落ちる不具合が入ると、
          # 失敗と再起動を延々と繰り返してしまうため。
          ELAPSED_MIN=$(( ( $(date +%s) - START_TS ) / 60 ))
          MIN_MIN=$(( LOOP_MINUTES * 8 / 10 ))
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "DISPATCH_TOKEN 未設定のため次の実行は起こしません"
          elif [ "$ELAPSED_MIN" -lt "$MIN_MIN" ]; then
            echo "実行が短すぎます（${ELAPSED_MIN}分 < ${MIN_MIN}分）。暴走を避けるため連鎖しません"
          else
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"loop\",\"loop_minutes\":\"${LOOP_MINUTES}\"}}" \
              "https://api.github.com/repos/${REPO}/actions/workflows/watch.yml/dispatches" \
              || echo "000")
            if [ "$CODE" = "204" ]; then
              echo "次の実行を起こしました"
            else
              echo "::warning::次の実行を起こせませんでした（HTTP ${CODE}）。トークンの失効かもしれません"
            fi
          fi
